<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><title>BODY FLOW VOICE LAB</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b2330;--text:#f4f7fb;--muted:#9ca9b8;--line:rgba(255,255,255,.1);--accent:#f6c85f;--ok:#74d99f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif;color:var(--text);background:linear-gradient(180deg,#111823,var(--bg) 42%)}button,select,input,textarea{font:inherit}.app{width:min(720px,100%);margin:auto;padding:max(20px,env(safe-area-inset-top)) 18px max(34px,env(safe-area-inset-bottom))}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{margin:6px 0 8px;font-size:clamp(30px,9vw,48px)}.lead,.hint{color:var(--muted);line-height:1.65}.card{background:rgba(21,27,35,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.card h2{margin:0 0 12px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.preset,.sample,.primary,.secondary{border-radius:15px;padding:13px;border:1px solid var(--line);font-weight:800}.preset,.sample,.secondary{background:var(--panel2);color:var(--text)}.preset.active{border-color:var(--accent);color:var(--accent)}.primary{width:100%;background:var(--accent);color:#17130a;border:0}.sample{text-align:left}.samples{display:grid;gap:8px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px}select,textarea{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}textarea{min-height:84px}.range{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center}.range input{width:100%}.value{color:var(--accent);font-weight:800;text-align:right}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{color:var(--ok);font-weight:800;min-height:20px}.back{color:var(--muted);text-decoration:none;font-size:13px}@media(max-width:420px){.grid,.buttons{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<div class="eyebrow">Sun Loves Flow / Body</div><h1>VOICE LAB</h1><p class="lead">声・高さ・速さをiPhone実機で比べる。気に入った設定はBODY FLOW用として端末に保存。</p>
<section class="card"><h2>① キャラ感</h2><div class="grid" id="presets"><button class="preset active" data-p="soft">SOFT<br><small>やさしく近い</small></button><button class="preset" data-p="cute">CUTE<br><small>明るく可愛い</small></button><button class="preset" data-p="genki">GENKI<br><small>元気に引っ張る</small></button><button class="preset" data-p="calm">CALM<br><small>落ち着いて伴走</small></button></div></section>
<section class="card"><h2>② 日本語音声</h2><select id="voice"><option value="">自動選択</option></select><p class="hint" id="voiceCount">読み込み中…</p></section>
<section class="card"><h2>③ 微調整</h2><label>高さ / Pitch</label><div class="range"><input id="pitch" type="range" min="0.7" max="1.8" step="0.05" value="1.08"><span class="value" id="pv">1.08</span></div><label>速さ / Rate</label><div class="range"><input id="rate" type="range" min="0.75" max="1.25" step="0.05" value="0.9"><span class="value" id="rv">0.90</span></div></section>
<section class="card"><h2>④ 実際のセリフ</h2><div class="samples"><button class="sample" data-t="まさ、散歩おつかれさま。ここから少しだけ身体つくろっか。">START｜散歩おつかれ</button><button class="sample" data-t="あと3回。急がなくていいよ。フォームきれいにね。">WORK｜あと3回</button><button class="sample" data-t="いい感じ。肩の力ぬいて、30秒だけ休も。">REST｜30秒</button><button class="sample" data-t="今日は回復の日だよ。頑張りすぎ禁止。整えて終わろ。">RECOVERY</button><button class="sample" data-t="終わり。今日もちゃんと積み上がったよ。おつかれさま。">FINISH</button></div><label>自由に試す</label><textarea id="custom">まさ、今日も20分だけやろ。無理に頑張らなくていいよ。</textarea><div class="buttons" style="margin-top:10px"><button class="primary" id="play">▶ 試す</button><button class="secondary" id="stop">■ 止める</button></div></section>
<section class="card"><h2>⑤ 保存・フィードフォアード</h2><button class="primary" id="save">この声設定を保存</button><button class="secondary" id="copy" style="width:100%;margin-top:10px">設定をコピー</button><p class="status" id="status"></p><p class="hint">コピーした内容をChatGPTへ貼れば、そのまま次版へ反映できる。</p></section><a class="back" href="./">← BODY FLOWへ戻る</a>
</main><script>
(()=>{const $=id=>document.getElementById(id),map={soft:[1.08,.90],cute:[1.35,1],genki:[1.22,1.12],calm:[.95,.84]};let preset='soft';function voices(){return 'speechSynthesis'in window?speechSynthesis.getVoices():[]}function jp(){return voices().filter(v=>/^ja(-|_)/i.test(v.lang))}function load(){const old=$('voice').value,x=jp();$('voice').innerHTML='<option value="">自動選択</option>'+x.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join('');if([...$('voice').options].some(o=>o.value===old))$('voice').value=old;$('voiceCount').textContent=`このSafariから見える日本語音声：${x.length}個` }load();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=load;function sync(){$('pv').textContent=Number($('pitch').value).toFixed(2);$('rv').textContent=Number($('rate').value).toFixed(2)}['pitch','rate'].forEach(id=>$(id).addEventListener('input',sync));function selected(){return voices().find(v=>v.name===$('voice').value)||jp()[0]||null}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.pitch=+$('pitch').value;u.rate=+$('rate').value;u.voice=selected();speechSynthesis.speak(u)}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{preset=b.dataset.p;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x===b));[$('pitch').value,$('rate').value]=map[preset];sync();speak('まさ、この感じどう？')});document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>speak(b.dataset.t));$('play').onclick=()=>speak($('custom').value);$('stop').onclick=()=>speechSynthesis.cancel();function cfg(){const v=selected();return{preset,voice:v?.name||'auto',pitch:+$('pitch').value,rate:+$('rate').value}}$('save').onclick=()=>{localStorage.setItem('bodyFlowVoiceConfig',JSON.stringify(cfg()));$('status').textContent='保存した！'};$('copy').onclick=async()=>{const c=cfg(),txt=`BODY FLOW VOICE FF\nPreset: ${c.preset}\nVoice: ${c.voice}\nPitch: ${c.pitch}\nRate: ${c.rate}\n良かった点:\n変えたい点:`;try{await navigator.clipboard.writeText(txt);$('status').textContent='コピーした！ChatGPTへ貼ってOK。'}catch(e){$('status').textContent=txt}};sync()})();
</script></body></html>
