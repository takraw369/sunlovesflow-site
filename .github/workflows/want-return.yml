name: Want Return Quest Check

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "quest/want-return/**"
      - ".github/workflows/want-return.yml"
  pull_request:
    branches: [main]
    paths:
      - "quest/want-return/**"
      - ".github/workflows/want-return.yml"

permissions:
  contents: read

concurrency:
  group: want-return-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript
        run: node --check quest/want-return/app.js

      - name: Check required assets and day routes
        run: |
          test -f quest/want-return/index.html
          test -f quest/want-return/styles.css
          test -f quest/want-return/app.js
          for day in 1 2 3 4 5 6 7; do
            test -f "quest/want-return/day/$day/index.html"
            grep -q "data-day=\"$day\"" "quest/want-return/day/$day/index.html"
            grep -q "../../app.js" "quest/want-return/day/$day/index.html"
          done

      - name: Guard accidental secrets in public quest files
        run: |
          if grep -R -Eiq 'SUPABASE_SERVICE_ROLE_KEY|LINE_CHANNEL_ACCESS_TOKEN|LINE_CHANNEL_SECRET|HARNESS_API_KEY' quest/want-return; then
            echo 'Potential secret reference found in public quest files'
            exit 1
          fi
